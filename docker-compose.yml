services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recaudacion
      POSTGRES_USER: recaudacion
      POSTGRES_PASSWORD: recaudacion
    ports:
      - "5432:5432"
    volumes:
      - recaudacion_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recaudacion -d recaudacion"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  recaudacion_pg:

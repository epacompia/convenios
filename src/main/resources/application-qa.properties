# Perfil: qa (pruebas de integracion). Activar con -Dquarkus.profile=qa o QUARKUS_PROFILE=qa.
# Log DEBUG para diagnosticar integraciones + archivo con rotacion.
quarkus.log.category."org.canalesCMAC".level=DEBUG
quarkus.log.file.enable=true
quarkus.log.file.path=${LOG_DIR:logs}/chn-base-backend.log
quarkus.log.file.rotation.max-file-size=20M
quarkus.log.file.rotation.max-backup-index=10

# URLs y credenciales obligatorias por variables de entorno (sin valores por defecto)
convenio.ELSE.url=${ELSE_URL}
convenio.ELECTRO_UCAYALI.url=${ELECTRO_UCAYALI_URL}
convenio.SEAL.url=${SEAL_URL}

recaudacion.electrosureste.usuario=${ELSE_USUARIO}
recaudacion.electrosureste.clave=${ELSE_CLAVE}
recaudacion.electroucayali.usuario=${ELECTRO_UCAYALI_USUARIO}
recaudacion.electroucayali.clave=${ELECTRO_UCAYALI_CLAVE}
recaudacion.seal.usuario=${SEAL_USUARIO}

# Base de datos QA (obligatoria por variables de entorno)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=30
quarkus.hibernate-orm.log.sql=false

# Redis QA
quarkus.redis.hosts=${REDIS_HOSTS}
recaudacion.redis.enabled=true

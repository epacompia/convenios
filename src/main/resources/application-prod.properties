# Perfil: prod (produccion). Perfil por defecto del artefacto empaquetado.
# Log INFO en JSON estructurado (para agregadores) + archivo con rotacion.
quarkus.log.category."org.canalesCMAC".level=INFO
quarkus.log.console.json=true
quarkus.log.file.enabled=true
quarkus.log.file.path=${LOG_DIR:logs}/convenios-caja-cusco.log
quarkus.log.file.level=INFO
quarkus.log.file.json=true
quarkus.log.file.rotation.file-suffix=-yyyy-MM-dd-HH
quarkus.log.file.rotation.rotate-on-boot=false

# URLs y credenciales obligatorias por variables de entorno (sin valores por defecto).
# Si falta alguna, la aplicacion no arranca (fail-fast).
convenio.ELSE.url=${ELSE_URL}
convenio.ELECTRO_UCAYALI.url=${ELECTRO_UCAYALI_URL}
convenio.SEAL.url=${SEAL_URL}
convenio.CLARO.url=${CLARO_URL}
convenio.MUNICIPALIDAD_CUSCO.url=${MUNICIPALIDAD_CUSCO_URL}
convenio.PAYTOPERU.url=${PAYTOPERU_URL}
convenio.UNIVCUSCO.url=${UNIVCUSCO_URL}
convenio.YAGANASTE.url=${YAGANASTE_URL}
convenio.WESTERN_UNION.url=${WESTERN_UNION_URL}
convenio.UNIVCONTINENTAL_UNIVERSIDAD.url=${UNIVCONTINENTAL_UNIVERSIDAD_URL}
convenio.UNIVCONTINENTAL_CIDIOMAS.url=${UNIVCONTINENTAL_CIDIOMAS_URL}
convenio.UNSAAC.url=${UNSAAC_URL}
convenio.UNSAAC.claveCifrado=${UNSAAC_CLAVE_CIFRADO}
convenio.UNIVCONTINENTAL_UNIVERSIDAD.apikey=${UNIVCONTINENTAL_UNIVERSIDAD_APIKEY}
convenio.UNIVCONTINENTAL_CIDIOMAS.apikey=${UNIVCONTINENTAL_CIDIOMAS_APIKEY}

recaudacion.electrosureste.usuario=${ELSE_USUARIO}
recaudacion.electrosureste.clave=${ELSE_CLAVE}
recaudacion.electroucayali.usuario=${ELECTRO_UCAYALI_USUARIO}
recaudacion.electroucayali.clave=${ELECTRO_UCAYALI_CLAVE}
recaudacion.seal.usuario=${SEAL_USUARIO}

# Base de datos producción (obligatoria por variables de entorno)
quarkus.datasource.db-kind=mssql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=50
quarkus.hibernate-orm.log.sql=false

# Redis producción
quarkus.redis.hosts=${REDIS_HOSTS}
recaudacion.redis.enabled=true

quarkus.http.port=8080
quarkus.application.name=chn-base-backend

# Formato de log con identificador de trazabilidad por peticion (X-Request-Id)
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] [%X{recaudacion.traceId}] %s%e%n
# Nivel base de la aplicacion (cada perfil lo sobreescribe en application-<perfil>.properties)
quarkus.log.category."org.canalesCMAC".level=INFO
%test.quarkus.log.category."org.canalesCMAC".level=DEBUG

# Log a archivo (rotativo). La carpeta se crea sola; ruta configurable con LOG_DIR (default: logs/)
quarkus.log.file.enable=true
quarkus.log.file.path=${LOG_DIR:logs}/chn-base-backend.log
quarkus.log.file.rotation.max-file-size=20M
quarkus.log.file.rotation.max-backup-index=10
# En pruebas se escribe un archivo aparte
%test.quarkus.log.file.path=${LOG_DIR:logs}/test.log

# Resiliencia (timeouts globales del cliente HTTP de Camel)
camel.component.http.connectTimeout=15000
camel.component.http.soTimeout=15000
# Reintentos por defecto (0 = sin reintentos; subir con cuidado en pagos).
# Se pueden sobreescribir por convenio con convenio.<X>.reintentos / .reintentos.delay
recaudacion.reintentos=0
recaudacion.reintentos.delay=500
# Timeout por convenio opcional (ms): convenio.<X>.timeout. Si se omite usa el global de Camel.
recaudacion.timeout=0

# Persistencia (dev/qa/prod configuran PostgreSQL en su perfil; test usa H2 en memoria)
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.datasource.health.enabled=true
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:recaudacion;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa

# Auditoria e idempotencia
recaudacion.auditoria.enabled=true
recaudacion.auditoria.fail-on-error=false
recaudacion.logs.enabled=true
recaudacion.intentos.enabled=true
recaudacion.idempotencia.durable.enabled=true
recaudacion.idempotencia.durable.ttl=86400
recaudacion.redis.enabled=false
recaudacion.redis.idempotencia.ttl=86400
%test.recaudacion.auditoria.enabled=true
%test.recaudacion.logs.enabled=true
%test.recaudacion.intentos.enabled=true
%test.recaudacion.idempotencia.durable.enabled=true
%test.recaudacion.redis.enabled=false

# Observabilidad
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.path=/q/metrics

# Registro de convenios (escalable: agregar un convenio = agregar estas propiedades
# + un MapeadorOperacion para su formato; ya no hace falta un adapter por convenio)

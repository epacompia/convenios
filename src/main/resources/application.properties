# Matriz de obligatoriedad configurable. Formato:
# convenio.<CONVENIO>.requerido.<OPERADOR>=campo1,campo2|campoAlternativo
# Los valores por defecto viven en MatrizObligatoriedad; estas propiedades los sobrescriben.
# convenio.ELSE.requerido.PAGO_DEUDA=identificadorTransaccion,numeroComprobante,numeroSuministro,monto
# convenio.SEAL.requerido.PAGO_DEUDA=contrato|numeroSuministro,monto

# Resiliencia por convenio: aislamiento real por institución.
# bulkhead.maxConcurrent=50 limita llamadas simultáneas por convenio (0 lo deshabilita).
# bulkhead.timeoutMs=5000 es la espera máxima por un permiso antes de responder 503.
# ratelimit.permitsPerSecond=0 queda deshabilitado hasta acordar cuota con cada proveedor.
# Circuit breaker: 20 requests, 50% de fallos, 5 s de apertura.
convenio.ELSE.cb.requestVolume=20
convenio.ELSE.cb.failureRatio=0.5
convenio.ELSE.cb.delayMs=5000
convenio.ELSE.bulkhead.maxConcurrent=50
convenio.ELSE.bulkhead.timeoutMs=5000
convenio.ELSE.ratelimit.permitsPerSecond=0


# Perfil: dev (desarrollo local). Activo por defecto con `mvn quarkus:dev`.
# Log verboso en consola para depurar integraciones.
quarkus.log.category."org.canalesCMAC".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{3.}] [traceId=%X{recaudacion.traceId}] [idTransaccion=%X{recaudacion.idTransaccion}] %s%e%n

# URLs y credenciales de desarrollo (por defecto las de application.properties)

# Base de datos de desarrollo (SQL Server local o docker-compose)
quarkus.datasource.db-kind=mssql
quarkus.datasource.username=${DB_USER:sa}
quarkus.datasource.password=${DB_PASSWORD:YourStrong!Passw0rd}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=recaudacion;encrypt=true;trustServerCertificate=true}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=20
quarkus.hibernate-orm.log.sql=false

# Redis de desarrollo (docker-compose). Deshabilitado por defecto para no exigirlo.
quarkus.redis.hosts=${REDIS_HOSTS:redis://localhost:6379}
recaudacion.redis.enabled=${REDIS_ENABLED:false}

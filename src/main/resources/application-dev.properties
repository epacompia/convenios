# Perfil: dev (desarrollo local). Activo por defecto con `mvn quarkus:dev`.
# Log verboso en consola para depurar integraciones.
quarkus.log.category."org.canalesCMAC".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{3.}] [%X{recaudacion.traceId}] %s%e%n

# URLs y credenciales de desarrollo (por defecto las de application.properties)

# Base de datos de desarrollo (PostgreSQL local o docker-compose)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:recaudacion}
quarkus.datasource.password=${DB_PASSWORD:recaudacion}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/recaudacion}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=20
quarkus.hibernate-orm.log.sql=false

# Redis de desarrollo (docker-compose). Deshabilitado por defecto para no exigirlo.
quarkus.redis.hosts=${REDIS_HOSTS:redis://localhost:6379}
recaudacion.redis.enabled=${REDIS_ENABLED:false}
